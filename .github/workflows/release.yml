# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach berm-client and berm-hook as release assets
      packages: write   # push the daemon image to ghcr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Derive the image tag from the RAW ref, not docker/metadata-action's
      # type=semver. The suite tags releases zero-padded and non-semver
      # (v00.01.00b1). type=semver,pattern={{version}} SILENTLY DROPS such a tag
      # and would publish only :latest. Stripping the leading v from the ref name
      # (${GITHUB_REF_NAME#v}) and feeding it as type=raw yields
      # ghcr.io/tagwright/berm:00.01.00b1, which matches the VERSION-stamped
      # `berm version`. See the Build Playbook release-tag trap.
      - name: Derive image tag from raw ref
        id: ver
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tagwright/berm
          tags: |
            type=raw,value=${{ steps.ver.outputs.tag }}
            type=raw,value=latest

      - name: Build and push daemon image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Operators need berm-client and berm-hook OUTSIDE the daemon image too:
      # the client and hook are host-side / app-image components, and lifting
      # them via `COPY --from=ghcr.io/tagwright/berm:<tag>` needs the image, but a
      # plain binary download is convenient for a Podman host installing the hook
      # or for CI. Build the two consumer binaries once, version-stamped, and
      # attach them to the release. The daemon binary is not attached: it only
      # ever runs as the published image.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build consumer binaries
        env:
          GOPRIVATE: github.com/tagwright/*
          CGO_ENABLED: '0'
        run: |
          VERSION="$(cat VERSION)"
          LDFLAGS="-s -w -X github.com/tagwright/berm/internal/version.Version=${VERSION}"
          mkdir -p dist
          go build -buildvcs=false -ldflags "${LDFLAGS}" -o dist/berm-client ./cmd/berm-client
          go build -buildvcs=false -ldflags "${LDFLAGS}" -o dist/berm-hook ./cmd/berm-hook
          ( cd dist && sha256sum berm-client berm-hook > SHA256SUMS )

      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/berm-client
            dist/berm-hook
            dist/SHA256SUMS

# One-time after the first successful publish: flip the ghcr package
# ghcr.io/tagwright/berm from private to public (GitHub -> tagwright org ->
# Packages -> berm -> Package settings -> Change visibility -> Public), the same
# one-time step ballast and the other suite images needed. Later publishes to the
# same package inherit the public visibility.
