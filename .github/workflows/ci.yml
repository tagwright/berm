name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Build, vet, and the unit tests. The job runs inside the golang:1.25 image as
  # root, which is the environment berm actually runs in: delivering a secret
  # chowns the file to its declared numeric owner (a core security behavior), and
  # chown to another uid needs CAP_CHOWN, which an unprivileged runner lacks. Root
  # in the toolchain image is also how every build was verified. GOPRIVATE lets
  # the build fetch tagwright's own modules (core, beacon) directly rather than
  # through the public proxy. go.sum still verifies them.
  build:
    runs-on: ubuntu-latest
    container: golang:1.25
    env:
      GOPRIVATE: github.com/tagwright/*
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  # The integration tests are gated behind the `integration` build tag and shell
  # out to sops and age-keygen, so they never run in the unit job above (which
  # would silently skip every //go:build integration file). This job installs the
  # SAME pinned sops and age the daemon image bundles, then runs the tagged suite,
  # so the end-to-end decrypt-and-deliver path is exercised on every push and PR
  # and is never silently skipped. It also runs as root in the toolchain image for
  # the same chown reason as the unit job. The live-container harness under
  # test/integration/ is driven by run.sh / run-podman.sh against a real host, not
  # by go test, so it deliberately does not run here.
  integration:
    runs-on: ubuntu-latest
    container: golang:1.25
    env:
      GOPRIVATE: github.com/tagwright/*
      SOPS_VERSION: 3.9.4
      SOPS_SHA256: 5488e32bc471de7982ad895dd054bbab3ab91c417a118426134551e9626e4e85
      AGE_VERSION: 1.2.1
      AGE_SHA256: 7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install pinned sops
        run: |
          curl -fsSL -o /tmp/sops \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  /tmp/sops" | sha256sum -c -
          install -m 0755 /tmp/sops /usr/local/bin/sops
          sops --version

      - name: Install pinned age (provides age and age-keygen)
        run: |
          curl -fsSL -o /tmp/age.tar.gz \
            "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  /tmp/age.tar.gz" | sha256sum -c -
          tar -xzf /tmp/age.tar.gz -C /tmp
          install -m 0755 /tmp/age/age /usr/local/bin/age
          install -m 0755 /tmp/age/age-keygen /usr/local/bin/age-keygen
          age-keygen --version

      - name: Integration tests
        run: go test -tags integration ./...
